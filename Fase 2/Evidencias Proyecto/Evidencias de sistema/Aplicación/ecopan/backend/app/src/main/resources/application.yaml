ktor:
  deployment:
    port: "$PORT:8080"
  application:
    modules:
      - com.f776.ecopan.api.MainKt.modules

# Defaults throughout match what docker-compose publishes to the host, so the backend also runs
# directly (`./gradlew :backend:app:run`) against a compose-hosted db/rabbitmq with no .env at all.
# Inside compose the .env overrides these with the service names (`db`, `rabbitmq`).
database:
  host: "$DB_HOST:localhost"
  port: "$DB_PORT:5432"
  driver: org.postgresql.Driver
  name: "$DB_NAME:ecopan"
  # `username`, not `user`: Settings reads database.username, and a key it does not find silently falls back
  # to `postgres`. (This line used to be `user:`, so every deployment logged in as postgres.) The variable
  # is DB_USERNAME, as for the worker and notifier.
  username: "$DB_USERNAME:postgres"
  password: "$DB_PASSWORD:postgres"

rabbitmq:
  host: "$RABBITMQ_HOST:localhost"
  port: "$RABBITMQ_PORT:5672"
  username: "$RABBITMQ_USER:guest"
  password: "$RABBITMQ_PASSWORD:guest"
  exchange: "$RABBITMQ_EXCHANGE:production"
  queue: "$RABBITMQ_QUEUE:production"
  routingKey: "$RABBITMQ_ROUTING_KEY:production"
  prefetch: "$RABBITMQ_PREFETCH:4"
  deadLetterExchange: "$RABBITMQ_DEAD_LETTER_EXCHANGE:production.dlx"
  deadLetterQueue: "$RABBITMQ_DEAD_LETTER_QUEUE:production.dlq"
  batchEventsExchange: "$RABBITMQ_BATCH_EVENTS_EXCHANGE:batch.events"
  batchEventsQueue: "$RABBITMQ_BATCH_EVENTS_QUEUE:batch.events"
  forecastRefreshExchange: "$RABBITMQ_FORECAST_REFRESH_EXCHANGE:forecast.refresh"
  forecastRefreshQueue: "$RABBITMQ_FORECAST_REFRESH_QUEUE:forecast.refresh"
  sseExchange: "$RABBITMQ_SSE_EXCHANGE:notifications.sse"
  sseDebounceMs: "$RABBITMQ_SSE_DEBOUNCE_MS:250"

# Which broker family this process uses, and the Service Bus coordinates for when it is `service_bus`. Empty
# means RabbitMQ (the compose default). The names match the worker's and notifier's, which read the
# environment directly; this app reads only this file, so without these entries BROKER_BACKEND=service_bus
# in Azure was ignored and the app stayed on RabbitMQ. ApplicationConfigKeysTest keeps the two in step.
broker:
  backend: "$BROKER_BACKEND:"

servicebus:
  connectionString: "$SERVICE_BUS_CONNECTION_STRING:"
  productionQueue: "$SERVICE_BUS_PRODUCTION_QUEUE:production"
  batchEventsQueue: "$SERVICE_BUS_BATCH_EVENTS_QUEUE:batch.events"
  forecastRefreshQueue: "$SERVICE_BUS_FORECAST_REFRESH_QUEUE:forecast.refresh"
  sseTopic: "$SERVICE_BUS_SSE_TOPIC:notifications.sse"
  maxConcurrentCalls: "$SERVICE_BUS_MAX_CONCURRENT_CALLS:4"
  prefetch: "$SERVICE_BUS_PREFETCH:0"
  maxDeliveryCount: "$SERVICE_BUS_MAX_DELIVERY_COUNT:5"
  sseSubscriptionIdleTtlMin: "$SERVICE_BUS_SSE_SUBSCRIPTION_IDLE_TTL_MIN:5"
  provisionTopology: "$SERVICE_BUS_PROVISION_TOPOLOGY:false"

# Product photos (core/storage). Clients upload to and read from blob storage directly; the API
# only signs short-lived upload URLs and records what was uploaded. Locally the store is Azurite,
# the Azure Storage emulator docker-compose runs as `storage`; the account name and key below are
# Azurite's fixed, published development credentials (https://github.com/Azure/Azurite#default-storage-account),
# not a secret. In Azure, STORAGE_ACCOUNT_URL is set instead and the app authenticates with its
# managed identity; when it is present the connection string is ignored. STORAGE_PUBLIC_BLOB_BASE_URL
# is the account root as a browser reaches it (defaults to the account URL in Azure, to the
# published Azurite port locally).
storage:
  connectionString: "$STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://localhost:10000/devstoreaccount1;"
  accountUrl: "$STORAGE_ACCOUNT_URL:"
  container: "$STORAGE_CONTAINER:product-images"
  publicBlobBaseUrl: "$STORAGE_PUBLIC_BLOB_BASE_URL:"

# Comma-separated seed profiles loaded at boot (01 §7, 11 §1). Defaults to the `reference` demo
# tenant so a fresh `docker compose up` is immediately login-able; set SEED_PROFILE= (empty) for a
# bare database, or SEED_PROFILE=reference,unipan to seed both demo tenants.
seed:
  profile: "$SEED_PROFILE:reference"

# Browser origins allowed to call this API (plan 07's web dashboard). Comma-separated whole origins,
# never a wildcard -- the KMP clients don't need CORS at all, so the list only ever names dashboards
# we control. Defaults are Vite's dev server and its `preview` server, so `webApp` works against a
# fresh `docker compose up`; a deployment sets CORS_ALLOWED_ORIGINS to its own origin.
cors:
  allowedOrigins: "$CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173"

jwt:
  secret: "$JWT_SECRET:dev-secret"
  # The app refuses to start with the dev-secret above unless this is true (#128). Local only:
  # docker-compose.yml turns it on; Azure sets a real JWT_SECRET and leaves this off.
  allowDevSecret: "$JWT_ALLOW_DEV_SECRET:false"
  issuer: "$JWT_ISSUER:ecopan"
  audience: "$JWT_AUDIENCE:ecopan-clients"
  accessTokenTtlMin: "$ACCESS_TOKEN_TTL_MIN:15"
  refreshTokenTtlDays: "$REFRESH_TOKEN_TTL_DAYS:30"

# Believe X-Forwarded-For (its last entry) as the client address (#129). True only behind a proxy
# that appends the real client, as App Service's front end does; reached directly, a client could
# name any address and buy itself a fresh rate-limit bucket per request.
proxy:
  trusted: "$BEHIND_TRUSTED_PROXY:false"

# Login/refresh attempts allowed per client address per minute (bcrypt makes each one expensive).
rateLimit:
  authPerMinute: "$AUTH_RATE_LIMIT_PER_MIN:30"

device:
  sessionTtlDays: "$DEVICE_SESSION_TTL_DAYS:180"

reporting:
  tz: "$REPORTING_TZ:America/Santiago"
