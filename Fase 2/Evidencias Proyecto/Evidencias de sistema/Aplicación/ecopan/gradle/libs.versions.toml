material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Backend only
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-datetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }
koin-ktor = { module = "io.insert-koin:koin-ktor", version.ref = "koin" }

# Coil 3 -- the Compose Multiplatform image loader. `coil-network-ktor3` rather than
# `coil-network-okhttp`, which is Android/JVM only: the baker client ships to iOS too, and the
# repo already stands up a ktor 3 client per platform for sync, so this reuses those engines
# instead of adding a second HTTP stack.
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
koin-loggerSlf4j = { module = "io.insert-koin:koin-logger-slf4j", version.ref = "koin" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
postgres = { module = "org.postgresql:postgresql", version.ref = "postgres" }
kourier = { module = "dev.kourier:amqp-client", version.ref = "kourier" }
azure-messaging-servicebus = { module = "com.azure:azure-messaging-servicebus", version.ref = "azureServiceBus" }
# Product photos: the same client library talks to Azurite under docker-compose and to a real
# storage account in Azure (backend/app .../core/storage/AzureBlobObjectStorage.kt).
azure-storage-blob = { module = "com.azure:azure-storage-blob", version.ref = "azureStorageBlob" }
azure-identity = { module = "com.azure:azure-identity", version.ref = "azureIdentity" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-junitJupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
kover-gradlePlugin = { group = "org.jetbrains.kotlinx", name = "kover-gradle-plugin", version.ref = "kover" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
