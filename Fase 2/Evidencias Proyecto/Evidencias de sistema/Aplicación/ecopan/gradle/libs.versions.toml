[bundles]

navigation3 = ["navigation3-ui", "androidx-lifecycle-viewmodel-navigation3", "adaptive-navigation3", "koin-navigation3"]
glance = ["glance-appwidget", "glance-material", "glance-appwidget-preview", "glance-preview"]
exposed = ["exposed-core", "exposed-dao", "exposed-jdbc", "exposed-datetime"]
